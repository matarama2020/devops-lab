name: ci-app

on:
  pull_request:
    paths: ["app/**"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  workflow_dispatch:

permissions:
  contents: read   # mínimo privilegio por defecto; cada job pide lo que necesita

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-push:
    needs: test
    if: github.event_name != 'pull_request'   # en PR solo se prueba, no se publica
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                         # publicar en GHCR
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          # GHCR exige minúsculas; el tag inmutable es el SHA corto del commit
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lab-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-push
    permissions:
      contents: write
    uses: ./.github/workflows/gitops-bump.yml
    with:
      image: lab-api
      tag: ${{ needs.build-push.outputs.tag }}
