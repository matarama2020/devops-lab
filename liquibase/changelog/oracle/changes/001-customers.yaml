# Oracle 11g NO tiene columnas IDENTITY (llegaron en 12c).
# Por eso: secuencia + trigger (002). Si usaras `autoIncrement: true` Liquibase generaría
# "GENERATED BY DEFAULT AS IDENTITY" y fallaría en 11g. Pruébalo como reto.
# Ojo también con el límite de 30 caracteres en nombres de objetos en 11g.
databaseChangeLog:
  - changeSet:
      id: 001-seq-customers
      author: lab
      labels: v1
      changes:
        - createSequence:
            sequenceName: SEQ_CUSTOMERS
            startValue: 1
            incrementBy: 1
            cacheSize: 20
      # createSequence tiene rollback automático (DROP SEQUENCE); no hace falta escribirlo.

  - changeSet:
      id: 001-table-customers
      author: lab
      labels: v1
      changes:
        - createTable:
            tableName: CUSTOMERS
            columns:
              - column:
                  name: ID
                  type: NUMBER(10)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_CUSTOMERS
              - column:
                  name: DOC_NUMBER
                  type: VARCHAR2(15)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UQ_CUSTOMERS_DOC
              - column:
                  name: FULL_NAME
                  type: VARCHAR2(150)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: DATE
                  defaultValueComputed: SYSDATE
                  constraints:
                    nullable: false
