# SQL Server como StatefulSet: identidad estable (sqlserver-0) y disco persistente propio.
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # primero la BD
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      securityContext:
        fsGroup: 10001                  # el usuario mssql debe poder escribir en el volumen
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits:   { memory: "3Gi" }
          # Ready = acepta consultas. ArgoCD espera esto antes de pasar a la wave 1.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  # Un PVC por réplica, creado automáticamente (kind usa el StorageClass "standard")
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
