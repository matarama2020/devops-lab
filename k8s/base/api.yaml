apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # después de las migraciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                 # nunca bajar de 2 pods sanos durante un despliegue
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lab-api
    spec:
      containers:
        - name: api
          image: lab-api                # Kustomize reemplaza nombre y tag (overlay)
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mssql-secret, key: MSSQL_SA_PASSWORD }
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi" }
          livenessProbe:                # ¿el proceso está vivo? si falla -> reinicia el contenedor
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          readinessProbe:               # ¿puede recibir tráfico? si falla -> sale del Service
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
spec:
  type: NodePort
  selector:
    app: lab-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080                   # mapeado a localhost:30080 por Terraform/kind
